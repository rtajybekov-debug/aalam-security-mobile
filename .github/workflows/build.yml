name: Expo Local Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI Global
        run: npm install -g eas-cli

      - name: Run EAS Build Locally
        # Изменяем команду на локальную сборку без авторизации
        run: npx eas-cli build --platform android --profile preview --local--non-interactive

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: ./*.apk # EAS local обычно кладет файл в корень проекта
